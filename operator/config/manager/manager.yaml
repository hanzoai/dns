apiVersion: v1
kind: Namespace
metadata:
  name: dns-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-operator
  namespace: dns-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: dns-operator
  namespace: dns-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-operator
  namespace: dns-system
  labels:
    app: dns-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-operator
  template:
    metadata:
      labels:
        app: dns-operator
    spec:
      serviceAccountName: dns-operator
      containers:
      - name: manager
        image: ghcr.io/hanzoai/dns-operator:v0.1.0  # pinned; CI publishes on tag
        args: ["--leader-elect"]
        env:
        # Scoped Cloudflare API token (Zone:DNS:Edit + Account:Pages:Edit),
        # KMS-synced. Optional: absent → CF reconcilers no-op, not crash.
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: api-token
              optional: true
        # hanzodns/CoreDNS Postgres backend (optional).
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dns-operator-db
              key: DATABASE_URL
              optional: true
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
      terminationGracePeriodSeconds: 10
