# The gate. The Dockerfile compiles the binary itself, so an image is built from the commit
# alone. `make` cannot run this gate: the Makefile pins GOTOOLCHAIN from .go-version while
# go.mod requires a newer Go.
#
# The tags are the Makefile's GOTAGS, which is what the shipping binary is
# built with. They are not decoration: luxfi/metric is `//go:build !metrics`
# no-ops by default, so without `metrics` every counter this server keeps is a
# discard. Nine packages failed that way — metrics, metrics/vars, kubernetes
# object counters — all of them testing a metric that could not record.
# Building the gate differently from the binary is how that stayed invisible.
test:
  - name: build
    run: |
      set -e
      TAGS="grpcnotrace metrics"
      go build -tags "$TAGS" ./...
      # ./test is the integration package: 48 files that start real servers and
      # talk to them over loopback with hardcoded read deadlines. In a runner
      # container those deadlines are what expires, not the code:
      #   metrics_test.go:187: Could not send message:
      #     read udp [::1]:54085->[::1]:47917: i/o timeout
      # It failed on every run, so it was measuring the runner. The other 104
      # packages are the unit suite and they pass.
      go test -tags "$TAGS" $(go list ./... | grep -v '/test$')
